services:
  - type: web
    name: nfl-live-sim
    runtime: node
    plan: starter          # the free plan's CPU is too small for Sunday afternoons, and disks need a paid plan
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: LEDGER_PATH
        value: /var/data/ledger.json
    disk:                  # keeps the signal record through deploys and restarts
      name: ledger
      mountPath: /var/data
      sizeGB: 1
