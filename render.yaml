services:
  - type: web
    name: cfb-live-sim
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeploy: true
    # Model picks are saved here so the record survives deploys and restarts
    disk:
      name: picks
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Simulation threads for live games. Starter has half a CPU, so one thread leaves room for serving pages.
      # On Standard (1 CPU) or Pro (2 CPU), raise this to 1-2 or 2-3.
      - key: SIM_THREADS
        value: "1"
      - key: DATA_DIR
        value: /var/data
      # Keep Node's heap well under Starter's 512 MB so it cleans up before the instance hits the limit
      - key: NODE_OPTIONS
        value: --max-old-space-size=280
      # ---- Polymarket US trading (see README "Trading"). Secrets: set these in the dashboard, never in this file.
      - key: TRADE_PASSWORD
        sync: false
      - key: POLYMARKET_US_KEY_ID
        sync: false
      - key: POLYMARKET_US_SECRET_KEY
        sync: false
      - key: TRADING_ENABLED
        value: "false"
      - key: MAX_ORDER_USD
        value: "10"
      - key: MAX_DAILY_USD
        value: "50"
      - key: MAX_OPEN_BETS
        value: "5"
      - key: PAPER_STAKE
        value: "10"
