<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP Poll & Seasons</title>
<meta name="description" content="Live projection of the next AP poll and a season simulator for every name-brand college football team.">
<link rel="icon" href="/logo.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F5F8;--card:#FFFFFF;--ink:#0C2340;--muted:#5A6A80;--line:#D8DEE7;--gold:#B8902A;--goldsoft:#F1E6C6;--bad:#B23A3A;--good:#2E7D4F;--live:#D23B3B;--peg:#9AA7B8;--base:#C9D1DC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0A1626;--card:#10213A;--ink:#E8EDF4;--muted:#93A3B8;--line:#22385A;--goldsoft:#3A3220;--live:#F0605A;--good:#4FB27A;--bad:#E26A6A;--peg:#4E6584;--base:#3A5276;}}
:root[data-theme="dark"]{--paper:#0A1626;--card:#10213A;--ink:#E8EDF4;--muted:#93A3B8;--line:#22385A;--goldsoft:#3A3220;--live:#F0605A;--good:#4FB27A;--bad:#E26A6A;--peg:#4E6584;--base:#3A5276;}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Barlow,system-ui,-apple-system,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mast{padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:16px}
.brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;margin-bottom:10px;font:800 21px/1 "Barlow Condensed",sans-serif}
.brand img{border-radius:8px;display:block}
.leaguebar{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.leaguebar a{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font:700 16px Barlow,sans-serif;text-decoration:none;color:var(--ink);background:var(--card)}
.leaguebar a:hover{border-color:var(--gold)}
.leaguebar a[aria-current="page"]{background:var(--gold);border-color:var(--gold);color:#0C2340}
.mast h1{font-size:clamp(32px,6vw,54px);line-height:.92;margin:0;font-weight:800}
.mast p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.tabs{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);margin:0 0 16px;width:fit-content;max-width:100%}
.tabs button{border:0;background:transparent;color:var(--ink);padding:10px 18px;font:700 16px Barlow,sans-serif;cursor:pointer}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:26px;line-height:1.05}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--live)}
/* Projected poll rows */
.prow{display:grid;grid-template-columns:40px 30px minmax(0,1fr) 120px 150px;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prk{font:800 26px/1 "Barlow Condensed",sans-serif;text-align:right}
.prow img{width:30px;height:30px;object-fit:contain}
.pnm{min-width:0}
.pnm b{font-size:17px}
.mv{font-size:12px;font-weight:700;margin-left:6px}
.mv.up{color:var(--good)}.mv.dn{color:var(--bad)}.mv.nw{color:var(--gold)}.mv.eq{color:var(--muted)}
.pg{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg .W{color:var(--good);font-weight:700}.pg .L{color:var(--bad);font-weight:700}.pg .LV{color:var(--live);font-weight:700}
.rng{font-size:13px;color:var(--muted);text-align:right}
.rng b{color:var(--ink);font-size:14px}
.spark{display:flex;align-items:flex-end;gap:1px;height:30px}
.spark i{flex:1;background:var(--gold);border-radius:2px 2px 0 0;min-height:1px;opacity:.95}
.spark i.out{background:var(--base)}
.spark i:hover{opacity:.6}
.bubble{margin-top:10px;padding-top:6px;border-top:2px dashed var(--line)}
.bubble h3{margin:8px 0 2px;font-size:18px}
@media (max-width:680px){
  .prow{grid-template-columns:34px 26px minmax(0,1fr) 92px;gap:8px}
  .prow .spark{grid-column:3 / 5;height:22px}
  .prk{font-size:22px}.prow img{width:26px;height:26px}
  .pg{white-space:normal}
}
/* Backtest */
.kpis{display:flex;gap:10px 26px;flex-wrap:wrap;margin:10px 0}
.kpis div{display:flex;flex-direction:column}
.kpis b{font:800 30px/1 "Barlow Condensed",sans-serif}
.kpis span{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:120px 1fr 52px;gap:6px 10px;align-items:center;font-size:14px;margin:8px 0}
.bars .bar{height:14px;background:var(--base);border-radius:0 4px 4px 0}
.bars .bar.me{background:var(--gold)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
details{margin-top:8px}summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;margin-left:6px;border:1px solid var(--line);color:var(--muted)}
.tag.live{border-color:var(--gold);color:var(--gold)}
.scroll{overflow-x:auto}
/* Season list */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
.filters input,.filters select{font:600 15px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.filters input{flex:1;min-width:180px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:36px 1fr;gap:4px 10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.tcard:hover{border-color:var(--gold)}
.tcard img{width:36px;height:36px;object-fit:contain;grid-row:1 / 3}
.tcard .nm{font-weight:700;font-size:16px;line-height:1.1}
.tcard .nm i{font-style:normal;color:var(--muted);font-weight:600;font-size:13px;margin-right:4px}
.tcard .meta{font-size:13px;color:var(--muted)}
.tcard .spark{grid-column:1 / 3;height:28px;margin-top:4px}
/* Team view */
.thead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.thead img{width:56px;height:56px;object-fit:contain}
.thead h2{font-size:32px}
.back{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 14px Barlow,sans-serif;cursor:pointer;margin-bottom:10px}
.board{position:relative;width:100%;margin-top:10px}
.board canvas{display:block;width:100%;border-radius:10px;background:var(--paper)}
.bctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.bctl button{border:1px solid var(--gold);background:var(--gold);color:#0C2340;border-radius:8px;padding:8px 14px;font:700 15px Barlow,sans-serif;cursor:pointer}
.bctl button.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.sched .pbar{position:relative;height:8px;border-radius:4px;background:var(--base);min-width:70px}
.sched .pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--gold)}
.res.W{color:var(--good);font-weight:700}.res.L{color:var(--bad);font-weight:700}.res.LV{color:var(--live);font-weight:700}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font:600 13px Barlow,sans-serif;padding:5px 8px;border-radius:6px;z-index:10;white-space:nowrap}
:root{--ta:#B8902A;--tb:#2F6DB5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ta:#B08A28;--tb:#5B8FD9}}
:root[data-theme="dark"]{--ta:#B08A28;--tb:#5B8FD9}
/* Week strip */
.weekstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:thin}
.weekstrip button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:700 14px Barlow,sans-serif;cursor:pointer;white-space:nowrap}
.weekstrip button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.weekstrip button.proj{border-style:dashed;border-color:var(--gold)}
.weekstrip button.proj[aria-pressed="true"]{background:var(--gold);color:#0C2340;border-style:solid}
.wkrow{display:grid;grid-template-columns:34px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}
.wkrow:hover{background:var(--goldsoft)}
.wkrow img{width:28px;height:28px;object-fit:contain}
.wkrow .said{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.wkrow .said b.hit{color:var(--good)}.wkrow .said b.off{color:var(--bad)}
/* Bump chart */
.bump{width:100%;overflow-x:auto}
.bump svg{display:block}
.bump .ln{fill:none;stroke:var(--base);stroke-width:1.5}
.bump .ln.on{stroke:var(--gold);stroke-width:3.5}
.bump .hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.bump text{fill:var(--muted);font:600 11px Barlow,sans-serif}
.bump text.on{fill:var(--ink);font-weight:800}
.bump .grid{stroke:var(--line);stroke-width:1}
.bump circle.on{fill:var(--gold);stroke:var(--card);stroke-width:2}
/* Chaos and what-if */
.chaos{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.chaos .big{font:800 30px/1 "Barlow Condensed",sans-serif}
.chaos .meter{display:flex;gap:3px;align-items:flex-end;height:36px}
.chaos .meter i{width:22px;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px}
.chaos .ml{display:flex;gap:3px;font-size:11px;color:var(--muted)}.chaos .ml span{width:22px;text-align:center}
.wibar{background:var(--goldsoft);border:1px solid var(--gold);border-radius:10px;padding:8px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.wibar button,.sw button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font:600 14px Barlow,sans-serif;cursor:pointer}
.slate{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sg{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px}
.sg .t{display:flex;gap:6px;align-items:center;min-width:0;font-weight:700}
.sg .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .t.h{justify-content:flex-end;text-align:right}
.sg img{width:24px;height:24px;object-fit:contain;flex:0 0 24px}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sw button{border:0;border-radius:0;padding:6px 9px;font-size:13px}
.sw button+button{border-left:1px solid var(--line)}
.sw button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.sg .st{font-size:12px;color:var(--muted);text-align:center}
.swing{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
.swing div{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px}
.swing b.s{font:800 22px/1 "Barlow Condensed",sans-serif;color:var(--gold);float:right}
/* Matchup */
.mpick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.mpick label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.mpick select{font:700 16px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 8px;width:100%}
.mpick .vs{font:800 22px "Barlow Condensed",sans-serif;padding-bottom:8px}
.mctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.mctl .seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mctl .seg2 button{border:0;background:var(--card);color:var(--ink);padding:8px 12px;font:600 14px Barlow,sans-serif;cursor:pointer}
.mctl .seg2 button+button{border-left:1px solid var(--line)}
.mctl .seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.mctl>button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 14px Barlow,sans-serif;cursor:pointer}
.sb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.sb img{width:64px;height:64px;object-fit:contain}
.sb .nm{font:800 22px/1.05 "Barlow Condensed",sans-serif;margin-top:4px}
.sb .sc{font:800 64px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb .dash{font:800 40px/1 "Barlow Condensed",sans-serif;color:var(--muted)}
.tug{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:14px 0 4px;gap:2px}
.tug div{display:flex;align-items:center;padding:0 10px;font:800 17px Barlow,sans-serif;color:#fff;min-width:0;white-space:nowrap}
.tug .A{background:var(--ta);justify-content:flex-start}.tug .B{background:var(--tb);justify-content:flex-end}
.grid100{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:560px;margin:8px 0}
.grid100 i{aspect-ratio:1;border-radius:3px}
.grid100 i.A{background:var(--ta)}.grid100 i.B{background:var(--tb)}
.grid100 i:hover{outline:2px solid var(--ink)}
@media (max-width:520px){.grid100{grid-template-columns:repeat(10,1fr)}.sb .sc{font-size:40px}.sb .dash{font-size:28px}.sb .nm{font-size:18px}.sb img{width:48px;height:48px}.mpick{grid-template-columns:1fr}.mpick .vs{display:none}}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.wf{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:6px 10px;align-items:center;font-size:14px;margin-top:8px}
.wf .track{position:relative;height:20px}
.wf .track i{position:absolute;top:2px;height:16px;border-radius:4px}
.wf .track .zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--muted)}
.wf .tot{font-weight:800}
.tape{display:grid;grid-template-columns:1fr minmax(90px,auto) 1fr;gap:6px 10px;align-items:center;font-size:14px;margin-top:8px}
.tape .lab{text-align:center;color:var(--muted);font-size:13px}
.tape .l,.tape .r{display:flex;align-items:center;gap:6px}
.tape .l{justify-content:flex-end}
.tape .l i,.tape .r i{height:14px;border-radius:4px;display:block}
.tape .l i{background:var(--ta);border-radius:4px 0 0 4px}.tape .r i{background:var(--tb);border-radius:0 4px 4px 0}
.tape b{white-space:nowrap}.tape b.edge::after{content:" ◆";color:var(--ink)}
.why{margin:8px 0 0;padding-left:18px}.why li{margin:4px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.mgrid{grid-template-columns:1fr}}
.err{background:#7a2e2e;color:#fff;padding:10px 14px;border-radius:10px;margin:0 0 12px;font:600 14px Barlow,sans-serif}
.skel{height:160px;border-radius:12px;background:var(--card);border:1px solid var(--line);opacity:.6}
</style></head>
<body><div class="wrap">
<header class="mast">
  <a class="brand" href="/" aria-label="Home"><img src="/logo.svg" alt="" width="34" height="34"><span>CFB Live Sim</span></a>
  <nav class="leaguebar" aria-label="Sections"><a href="/cfb">College football</a><a href="/nfl">NFL</a><a href="/ap" aria-current="page">AP poll & seasons</a></nav>
  <h1>AP poll & seasons</h1>
  <p>Where every team should land in next week's AP poll, updating live as this week's games play out; every poll this season; how each team's season is likely to finish; and any matchup you can dream up.</p>
</header>
<div class="tabs" role="tablist">
  <button role="tab" id="tabPoll" aria-selected="true" data-tab="poll">AP poll projection</button>
  <button role="tab" id="tabSeason" aria-selected="false" data-tab="season">Season simulator</button>
  <button role="tab" id="tabMatch" aria-selected="false" data-tab="matchup">Matchup machine</button>
</div>
<div id="err" class="err" hidden></div>

<section id="pollView">
  <nav class="weekstrip" id="weekStrip" aria-label="Poll week"></nav>
  <div class="panel" id="weekPanel" hidden></div>
  <div class="panel" id="projPanel"><div class="skel"></div></div>
  <div class="panel" id="whatifPanel" hidden></div>
  <div class="panel" id="bumpPanel" hidden></div>
  <div class="panel" id="btPanel" hidden></div>
</section>
<section id="matchView" hidden>
  <div class="panel" id="matchPick"><div class="skel"></div></div>
  <div id="matchOut"></div>
</section>

<section id="seasonView" hidden>
  <div class="panel" id="listPanel"><div class="skel"></div></div>
  <div class="panel" id="teamPanel" hidden></div>
</section>
<div class="tip" id="tip" hidden></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const logo=id=>`https://a.espncdn.com/i/teamlogos/ncaa/500/${encodeURIComponent(id)}.png`;
const pct=v=>v==null?'–':Math.round(v*100)+'%';
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- hover tooltips: any element with data-tip ----------
const tip=$('tip');
document.addEventListener('pointerover',e=>{ const t=e.target.closest('[data-tip]'); if(!t){ tip.hidden=true; return; } tip.textContent=t.dataset.tip; tip.hidden=false; });
document.addEventListener('pointermove',e=>{ if(tip.hidden) return; const x=Math.min(e.clientX+12, innerWidth-tip.offsetWidth-8); tip.style.left=x+'px'; tip.style.top=(e.clientY-34)+'px'; });
document.addEventListener('pointerout',e=>{ if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('[data-tip]')) tip.hidden=true; });

// ---------- tabs and routing: #poll, #season, #team=ID ----------
function route(){
  const h=location.hash.slice(1), team=(h.match(/^team=(\d+)/)||[])[1], season=h==='season'||!!team, match=/^matchup/.test(h), poll=!season&&!match;
  $('tabPoll').setAttribute('aria-selected',String(poll)); $('tabSeason').setAttribute('aria-selected',String(season)); $('tabMatch').setAttribute('aria-selected',String(match));
  $('pollView').hidden=!poll; $('seasonView').hidden=!season; $('matchView').hidden=!match;
  if(season){ if(team) openTeam(team); else { $('teamPanel').hidden=true; $('listPanel').hidden=false; loadTeams(); } }
  else if(match) openMatch(h); else loadPoll();
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{ location.hash=b.dataset.tab; });
addEventListener('hashchange',route);
function showErr(m){ const e=$('err'); e.textContent=m; e.hidden=!m; }

// ---------- AP poll projection ----------
let POLL=null;
function gameText(g){
  if(!g) return '<span>Bye this week</span>';
  const vs=`${g.neutral?'vs':g.home?'vs':'at'} ${g.oppRank?'#'+g.oppRank+' ':''}${esc(g.opp)}`;
  if(g.state==='post'){ const w=g.us>g.them; return `<span class="${w?'W':'L'}">${w?'W':'L'} ${g.us}–${g.them}</span> ${vs}`; }
  if(g.state==='in') return `<span class="LV">LIVE ${g.us??0}–${g.them??0}</span> ${vs} · ${esc(g.clock)} · ${pct(g.p)} to win`;
  return `${vs} · ${pct(g.p)} to win`;
}

    <div class="thead"><img src="${logo(t.id)}" alt="" onerror="this.style.visibility='hidden'"><div><h2>${t.rank?'#'+t.rank+' ':''}${esc(t.name)}</h2><p class="sub">${esc(t.conf)} · ${t.w}–${t.l} now · rating ${t.rating>0?'+':''}${t.rating} pts vs an average FBS team</p></div></div>
    <div class="kpis"><div><b>${exp}</b><span>expected final record</span></div><div><b>${best}–${t.games.length-best}</b><span>most likely (${pct(t.hist[best])})</span></div><div><b>${pct(t.hist[t.w+rest.length])}</b><span>chance to win out</span></div><div><b>${rest.length}</b><span>games left</span></div></div>
    ${rest.length?`<h3 style="margin:14px 0 2px;font-size:20px">Watch the rest of the season drop</h3>
    <p class="sub">Each row of pegs is a game still to play. At every peg a ball bounces right (win) with that game's win chance or left (loss). Where 60 balls land is a spread of final records; the outline is the same thing from ${t.sims.toLocaleString()} full simulations.</p>
    <div class="board"><canvas id="cv" role="img" aria-label="Dropping-ball board of ${esc(t.name)}'s remaining games"></canvas></div>
    <div class="bctl"><button id="drop">Drop 60 again</button><button class="ghost" id="fast">Show result</button><span class="sub" id="landed"></span></div>
    <div class="legend"><span><i style="background:var(--gold)"></i>balls (one season each)</span><span><i style="background:transparent;border:2px solid var(--ink)"></i>${t.sims.toLocaleString()}-sim spread</span></div>`:'<p class="sub">Regular season complete.</p>'}
    <h3 style="margin:16px 0 4px;font-size:20px">Schedule</h3>
    <div class="scroll sched"><table><thead><tr><th>Wk</th><th>Opponent</th><th>Result</th><th class="num">Win %</th><th style="min-width:90px"></th></tr></thead><tbody>${t.games.map(row).join('')}</tbody></table></div>
    <p class="sub" style="margin-top:10px">Win chances come from team ratings built from this season's scores (last season's as the starting point), plus the betting line and ESPN's live win probability when a game is on. Backtested 2014–2025, the favorite won 72.7% of FBS games. Regular season only; conference title games aren't scheduled yet. Each simulation also nudges every team's strength a little, because nobody knows exactly how good a team is, which makes the spread wider and more honest than treating games as coin flips.</p>`;
  if(rest.length){ $('drop').onclick=()=>drop(t,false); $('fast').onclick=()=>drop(t,true); drop(t,false); }
}
function drop(t,instant){
  if(anim) cancelAnimationFrame(anim);
  const cv=$('cv'); if(!cv) return;
  const rest=t.games.filter(g=>g.state!=='post'), n=rest.length, W0=t.w, dpr=devicePixelRatio||1;
  const Wd=cv.parentElement.clientWidth, labW=Wd<520?118:170, binH=Wd<520?110:140, rowH=Wd<520?30:36, Hd=24+n*rowH+binH+34;
  cv.width=Wd*dpr; cv.height=Hd*dpr; cv.style.height=Hd+'px'; const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const plotW=Wd-labW-12, nb=n+1, colW=plotW/nb, x0=labW;
  const px=(row,k)=>x0+colW*(k+(n-row)/2)+colW/2, py=row=>24+row*rowH; // peg k of row `row` (k = wins so far)
  const cols={ink:css('--ink'),muted:css('--muted'),gold:css('--gold'),peg:css('--peg'),line:css('--line'),base:css('--base'),good:css('--good'),bad:css('--bad')};
  // 60 seasons, each a path of win/loss bounces
  const balls=[]; for(let b=0;b<60;b++){ let k=0; const path=[0]; for(const g of rest){ if(Math.random()<g.p) k++; path.push(k); } balls.push({path,start:b*7,k}); }
  const counts=new Array(nb).fill(0), binTop=24+n*rowH+8, binBot=Hd-30;
  const expMax=Math.max(...t.hist.slice(W0,W0+nb),0.001);
  function frame(f){
    c.clearRect(0,0,Wd,Hd);
    c.font='600 12px Barlow, sans-serif'; c.textBaseline='middle';
    rest.forEach((g,i)=>{
      // win % right-aligned at the label column's edge, the opponent's name trimmed to the room left of it
      c.fillStyle=cols.ink; c.textAlign='right'; c.fillText(Math.round(g.p*100)+'%',labW-8,py(i));
      let s=(g.home||g.neutral?'':'@')+(g.oppRank?'#'+g.oppRank+' ':'')+g.opp; const room=labW-8-c.measureText('100%').width-6;
      if(c.measureText(s).width>room){ while(s.length>1&&c.measureText(s+'…').width>room) s=s.slice(0,-1); s+='…'; }
      c.fillStyle=cols.muted; c.textAlign='left'; c.fillText(s,4,py(i));
      for(let k=0;k<=i;k++){ c.beginPath(); c.arc(px(i,k),py(i),3,0,7); c.fillStyle=cols.peg; c.fill(); } });
    // bins
    const bh=binBot-binTop, mxc=Math.max(...counts,1), scale=Math.max(mxc/60, expMax);
    for(let k=0;k<nb;k++){ const x=x0+colW*k+colW/2, wbin=Math.max(4,colW-6);
      const h=counts[k]/60/scale*bh; if(h>0){ c.fillStyle=cols.gold; roundTop(c,x-wbin/2,binBot-h,wbin,h,4); }
      c.fillStyle=cols.ink; c.textAlign='center'; c.font='700 13px Barlow, sans-serif'; c.fillText(`${W0+k}–${t.games.length-W0-k}`,x,binBot+14); c.font='600 12px Barlow, sans-serif';
      if(counts[k]){ c.fillStyle=cols.ink; c.fillText(counts[k],x,binBot-h-9); } }
    // the full-simulation spread as an outline
    c.beginPath(); for(let k=0;k<nb;k++){ const x=x0+colW*k+colW/2, y=binBot-(t.hist[W0+k]||0)/scale*bh; k?c.lineTo(x,y):c.moveTo(x,y); } c.strokeStyle=cols.ink; c.lineWidth=2; c.stroke();
    c.strokeStyle=cols.line; c.lineWidth=1; c.beginPath(); c.moveTo(x0,binBot+.5); c.lineTo(x0+plotW,binBot+.5); c.stroke();
    // balls in flight
    let alive=0;
    for(const b of balls){ const t0=(f-b.start)/9; if(t0<0){ alive++; continue; } if(b.done) continue;
      const row=Math.floor(t0); if(row>=n){ b.done=true; counts[b.k]++; continue; } alive++;
      const fr=t0-row, xA=row===0?px(0,0):px(row,b.path[row]), yA=py(row), xB=row+1<=n-1?px(row+1,b.path[row+1]):x0+colW*b.path[n]+colW/2, yB=row+1<=n-1?py(row+1):binTop;
      const x=xA+(xB-xA)*fr, y=yA+(yB-yA)*fr-Math.sin(fr*Math.PI)*8;
      c.beginPath(); c.arc(x,y,4.5,0,7); c.fillStyle=cols.gold; c.fill(); c.lineWidth=1.5; c.strokeStyle=css('--paper'); c.stroke(); }
    const lab=$('landed'); if(lab){ const done=counts.reduce((a,b)=>a+b,0); lab.textContent=done?`${done} of 60 seasons landed`:''; }
    if(alive) anim=requestAnimationFrame(()=>frame(f+1)); else anim=null;
  }
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){ for(const b of balls){ counts[b.k]++; b.done=true; } frame(1e9); } else frame(0);
}
function roundTop(c,x,y,w,h,r){ r=Math.min(r,h,w/2); c.beginPath(); c.moveTo(x,y+h); c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r); c.lineTo(x+w,y+h); c.closePath(); c.fill(); }

// ---------- Matchup machine ----------
let PICK=null, M={a:null,b:null,site:'n'};
async function openMatch(h){
  const m=h.match(/^matchup=(\d+),(\d+),?([anb])?/); if(m){ M={a:m[1],b:m[2],site:m[3]||'n'}; }
  try{ if(!PICK){ const r=await fetch('/api/ap/pick'); if(!r.ok) throw new Error('Teams unavailable'); PICK=await r.json(); } }catch(e){ showErr(e.message); return; }
  if(!M.a||!M.b){ const top=PICK.filter(t=>t.rank).sort((x,y)=>x.rank-y.rank); M.a=(top[0]||PICK[0]).id; M.b=(top[1]||PICK[1]).id; }
  renderPick(); runMatch();
}
function renderPick(){
  const ranked=PICK.filter(t=>t.rank).sort((x,y)=>x.rank-y.rank), confs={}; for(const t of PICK) (confs[t.conf]||(confs[t.conf]=[])).push(t);
  const opts=sel=>`<optgroup label="AP top 25">${ranked.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>#${t.rank} ${esc(t.name)}</option>`).join('')}</optgroup>`+
    Object.keys(confs).sort().map(c=>`<optgroup label="${esc(c)}">${confs[c].map(t=>`<option value="${t.id}" ${t.id===sel&&!t.rank?'selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('');
  const nA=(PICK.find(t=>t.id===M.a)||{}).name||'Team A', nB=(PICK.find(t=>t.id===M.b)||{}).name||'Team B';
  $('matchPick').innerHTML=`<h2>Matchup machine</h2><p class="sub">Any two FBS teams, anywhere. The projection uses the same ratings as the season simulator, built from this season's scores.</p>
    <div class="mpick" style="margin-top:10px"><label>Team A<select id="mA">${opts(M.a)}</select></label><div class="vs">vs</div><label>Team B<select id="mB">${opts(M.b)}</select></label></div>
    <div class="mctl"><div class="seg2" role="group" aria-label="Where">${[['a',esc(nA)+' home'],['n','Neutral site'],['b',esc(nB)+' home']].map(([k,l])=>`<button data-site="${k}" aria-pressed="${M.site===k}">${l}</button>`).join('')}</div>
      <button id="mSwap">⇄ Swap</button><button id="mRand">🎲 Random top-10 clash</button></div>`;
  $('mA').onchange=e=>{ M.a=e.target.value; go(); }; $('mB').onchange=e=>{ M.b=e.target.value; go(); };
  $('matchPick').querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{ M.site=b.dataset.site; go(); });
  $('mSwap').onclick=()=>{ [M.a,M.b]=[M.b,M.a]; M.site=M.site==='a'?'b':M.site==='b'?'a':'n'; go(); };
  $('mRand').onclick=()=>{ const t=ranked.slice(0,10); if(t.length<2) return; const i=Math.floor(Math.random()*t.length); let j=Math.floor(Math.random()*(t.length-1)); if(j>=i) j++; M.a=t[i].id; M.b=t[j].id; M.site='n'; go(); };
}
const go=()=>{ history.replaceState(null,'','#matchup='+M.a+','+M.b+','+M.site); renderPick(); runMatch(); };
async function runMatch(){
  const out=$('matchOut');
  if(M.a===M.b){ out.innerHTML='<div class="panel"><p class="sub">Pick two different teams.</p></div>'; return; }
  try{
    const r=await fetch(`/api/ap/matchup?a=${M.a}&b=${M.b}&site=${M.site}`); if(!r.ok) throw new Error('Could not build that matchup');
    const d=await r.json(); showErr(''); out.innerHTML=renderMatch(d);
  }catch(e){ showErr(e.message); }
}
function renderMatch(d){
  const A=d.a, B=d.b, nm=t=>`${t.rank?'#'+t.rank+' ':''}${esc(t.name)}`, fav=d.margin>=0?A:B, by=Math.abs(d.margin);
  const winsA=d.sims.filter(x=>x[0]>x[1]).length, sign=v=>(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1);
  const where=d.site==='a'?`at ${esc(A.name)}`:d.site==='b'?`at ${esc(B.name)}`:'on a neutral field';
  // 1. scoreboard + tug of war
  const sb=`<div class="panel"><div class="sb"><div><img src="${logo(A.id)}" alt="" onerror="this.style.visibility='hidden'"><div class="nm">${nm(A)}</div><div class="sub">${A.w}–${A.l}</div></div>
      <div><div class="sc"><span style="color:var(--ta)">${d.score[0]}</span><span class="dash"> – </span><span style="color:var(--tb)">${d.score[1]}</span></div><div class="sub">projected score, ${where}</div></div>
      <div><img src="${logo(B.id)}" alt="" onerror="this.style.visibility='hidden'"><div class="nm">${nm(B)}</div><div class="sub">${B.w}–${B.l}</div></div></div>
    <div class="tug" role="img" aria-label="Win chances"><div class="A" style="flex:${Math.max(d.p,0.08)}">${esc(A.name)} ${pct(d.p)}</div><div class="B" style="flex:${Math.max(1-d.p,0.08)}">${pct(1-d.p)} ${esc(B.name)}</div></div>
    <p class="sub" style="text-align:center">${by<0.5?'A coin flip.':`${esc(fav.name)} by ${by.toFixed(1)}.`} Expected total ${d.total.toFixed(0)} points.
      ${d.real?(d.real.final?` They played this season, week ${d.real.week}: ${esc(d.real.homeId===A.id?A.name:B.name)} ${d.real.hs}, ${esc(d.real.homeId===A.id?B.name:A.name)} ${d.real.as}.`:` They really meet week ${d.real.week} (${esc(d.real.date)}) at ${esc(d.real.homeId===A.id?A.name:B.name)}.`):''}</p></div>`;
  // 2. 100 games
  const grid=`<div class="panel"><h2>Play it 100 times</h2><p class="sub">Each square is one simulated game. Hover or tap for its final score.</p>
    <div class="grid100">${d.sims.map(([x,y])=>`<i class="${x>y?'A':'B'}" data-tip="${esc(A.name)} ${x}, ${esc(B.name)} ${y}"></i>`).join('')}</div>
    <div class="key"><span><i style="background:var(--ta)"></i>${esc(A.name)} wins <b>${winsA}</b></span><span><i style="background:var(--tb)"></i>${esc(B.name)} wins <b>${100-winsA}</b></span></div></div>`;
  // 3. margin curve (SVG, diverging around zero)
  const cw=640, ch=170, mxp=Math.max(...d.curve.map(c=>c.p)), bw=cw/d.curve.length;
  const bars=d.curve.map((c,i)=>{ const h=c.p/mxp*(ch-40), x=i*bw, a=c.m>0||(c.m===0&&d.margin>=0);
    return `<rect x="${x+1}" y="${ch-24-h}" width="${bw-2}" height="${Math.max(h,0.5)}" rx="3" fill="var(${a?'--ta':'--tb'})" data-tip="${c.m===0?'Within a point and a half':(c.m>0?esc(A.name):esc(B.name))+' by '+(Math.abs(c.m)-1)+'–'+(Math.abs(c.m)+1)}: ${(c.p*100).toFixed(1)}%"></rect>`; }).join('');
  const zx=d.curve.findIndex(c=>c.m===0)*bw+bw/2, mx=zx+d.margin/3*bw;
  const ticks=[-42,-28,-14,0,14,28,42].map(m=>{ const x=zx+m/3*bw; return `<text x="${x}" y="${ch-6}" text-anchor="middle" fill="var(--muted)" font-size="14" font-family="Barlow,sans-serif">${m===0?'0':(m<0?esc(short(B.name)):esc(short(A.name)))+' +'+Math.abs(m)}</text>`; }).join('');
  const curve=`<div class="panel"><h2>How it ends</h2><p class="sub">Every possible final margin and its chance. ${esc(A.name)} wins on the right, ${esc(B.name)} on the left; the line is the expected margin.</p>
    <svg viewBox="0 0 ${cw} ${ch}" width="100%" role="img" aria-label="Margin of victory distribution">${bars}<line x1="${zx}" x2="${zx}" y1="8" y2="${ch-22}" stroke="var(--muted)" stroke-dasharray="3 3"/><line x1="${mx}" x2="${mx}" y1="8" y2="${ch-22}" stroke="var(--ink)" stroke-width="2"/><text x="${mx+(d.margin>=0?4:-4)}" y="16" text-anchor="${d.margin>=0?'start':'end'}" fill="var(--ink)" font-size="15" font-weight="700" font-family="Barlow,sans-serif">expected: ${by<0.5?'even':esc(fav.name)+' by '+by.toFixed(1)}</text>${ticks}</svg>
    <p class="sub">One-score game (8 points or less): <b>${pct(d.curve.filter(c=>Math.abs(c.m)<=7).reduce((a,c)=>a+c.p,0))}</b> · blowout (22+): <b>${pct(d.curve.filter(c=>Math.abs(c.m)>=22).reduce((a,c)=>a+c.p,0))}</b></p></div>`;
  // 4. why: waterfall from 0 to the expected margin
  const steps=[[`${esc(A.name)} rating`,d.parts.a],[`${esc(B.name)} rating`,-d.parts.b],['Home field',d.parts.home]];
  let acc=0; const lo=Math.min(0,...steps.map((_,i)=>steps.slice(0,i+1).reduce((a,s)=>a+s[1],0))), hi=Math.max(0,...steps.map((_,i)=>steps.slice(0,i+1).reduce((a,s)=>a+s[1],0))), span=Math.max(1,hi-lo), P=v=>(v-lo)/span*100;
  const wf=steps.map(([l,v])=>{ const a0=acc; acc+=v; const x0=Math.min(a0,acc), x1=Math.max(a0,acc);
    return `<span>${l}</span><div class="track"><span class="zero" style="left:${P(0)}%"></span><i style="left:${P(x0)}%;width:${Math.max(0.5,P(x1)-P(x0))}%;background:var(${v>=0?'--ta':'--tb'})" data-tip="${l}: ${sign(v)}"></i></div><span class="num">${sign(v)}</span>`; }).join('')
    +`<span class="tot">Expected margin</span><div class="track"><span class="zero" style="left:${P(0)}%"></span><i style="left:${P(Math.min(0,acc))}%;width:${Math.abs(P(acc)-P(0))}%;background:var(--ink)"></i></div><span class="num tot">${sign(acc)}</span>`;
  // 5. tale of the tape: mirrored bars, the better side marked
  const rows=[['Power rating',A.rating,B.rating,1,'pts vs avg'],['Offense',A.off,B.off,1,'pts vs avg'],['Defense',A.def,B.def,1,'pts vs avg'],['Points per game',A.ppg,B.ppg,1,''],['Allowed per game',A.papg,B.papg,-1,''],['Schedule strength',A.sos,B.sos,1,'avg opp rating'],['Last 3 games vs. expected',A.form,B.form,1,'pts']];
  const tape=rows.map(([l,x,y,dir,u])=>{ const m=Math.max(Math.abs(x),Math.abs(y),1), ea=(x-y)*dir>0.05, eb=(y-x)*dir>0.05;
    return `<div class="l"><b class="${ea?'edge':''}">${x}</b><i style="width:${Math.abs(x)/m*100}%;max-width:100%;opacity:${x<0?.45:1}" data-tip="${esc(A.name)}: ${x} ${u}"></i></div><div class="lab">${l}</div><div class="r"><i style="width:${Math.abs(y)/m*100}%;opacity:${y<0?.45:1}" data-tip="${esc(B.name)}: ${y} ${u}"></i><b class="${eb?'edge':''}">${y}</b></div>`; }).join('');
  // 6. plain-English reasons
  const why=[];
  const gap=d.parts.a-d.parts.b; why.push(Math.abs(gap)<1.5?`On season results these two are almost dead even (ratings ${sign(d.parts.a)} vs ${sign(d.parts.b)}).`:`${esc(gap>0?A.name:B.name)} has been ${Math.abs(gap).toFixed(1)} points per game better this season once schedules are accounted for (#${gap>0?A.ratingRank:B.ratingRank} of ${A.of} in power rating vs. #${gap>0?B.ratingRank:A.ratingRank}).`);
  const uA=d.parts.offA, uB=d.parts.offB; why.push(`${esc(A.name)}'s offense (#${A.offRank}) against ${esc(B.name)}'s defense (#${B.defRank}) projects ${(d.parts.mean+uA+d.hfa/2).toFixed(0)} points; ${esc(B.name)}'s offense (#${B.offRank}) against ${esc(A.name)}'s defense (#${A.defRank}) projects ${(d.parts.mean+uB-d.hfa/2).toFixed(0)}. Before home field, ${Math.abs(uA-uB)<0.5?'neither side has the better offense-vs-defense matchup':`${uA-uB>0?esc(A.name)+"'s":esc(B.name)+"'s"} offense has the better matchup (${sign(Math.max(uA,uB))} vs ${sign(Math.min(uA,uB))} points against an average defense)`}.`);
  if(d.hfa) why.push(`Home field is worth about ${Math.abs(d.hfa)} points to ${esc(d.hfa>0?A.name:B.name)}.`);
  if(d.common.length) why.push(`Common opponents (${d.common.length}) point to ${d.commonImplied>=0?esc(A.name):esc(B.name)} by ${Math.abs(d.commonImplied).toFixed(1)}, ${Math.sign(d.commonImplied)===Math.sign(d.margin)?'agreeing with':'pushing against'} the ratings.`);
  for(const [t,o] of [[A,B],[B,A]]) if(Math.abs(t.form)>=7) why.push(`${esc(t.name)} has played ${Math.abs(t.form).toFixed(0)} points per game ${t.form>0?'better':'worse'} than expected over its last 3. The ratings count that, but recent form isn't weighted extra.`);
  const res=t=>`${t.best?`Best win: ${esc(t.best.opName)} ${t.best.us}–${t.best.them}`:'No wins yet'}${t.worst?` · Worst loss: ${esc(t.worst.opName)} ${t.worst.us}–${t.worst.them}`:' · Unbeaten'}`;
  const whyP=`<div class="panel"><h2>Why</h2><ul class="why">${why.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h3 style="margin:14px 0 2px;font-size:18px">Where the margin comes from</h3><div class="wf">${wf}</div>
    <h3 style="margin:16px 0 2px;font-size:18px">Tale of the tape</h3><div class="key"><span><i style="background:var(--ta)"></i>${esc(A.name)}</span><span><i style="background:var(--tb)"></i>${esc(B.name)}</span><span>◆ = the edge</span></div><div class="tape">${tape}</div>
    <div class="mgrid" style="margin-top:12px"><p class="sub"><b>${esc(A.name)}</b> ${A.w}–${A.l}. ${res(A)}</p><p class="sub"><b>${esc(B.name)}</b> ${B.w}–${B.l}. ${res(B)}</p></div>
    ${d.common.length?`<h3 style="margin:14px 0 2px;font-size:18px">Common opponents</h3><div class="scroll"><table><thead><tr><th>Opponent</th><th>${esc(A.name)}</th><th>${esc(B.name)}</th><th class="num">Points to ${esc(short(A.name))}</th></tr></thead><tbody>${d.common.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.a}</td><td>${c.b}</td><td class="num">${sign(c.implied)}</td></tr>`).join('')}</tbody></table></div><p class="sub">Each margin is adjusted for home field first.</p>`:''}
    <p class="sub" style="margin-top:12px">Ratings are points per game better than an average FBS team, from this season's scores with last season as a starting point. Backtested, the favorite wins 72.7% of FBS games; win chances use a 12.5-point spread. The score splits the margin using offense and defense ratings. It knows scores, not injuries, weather or rivalries.</p></div>`;
  return sb+`<div class="mgrid">${grid}${curve}</div>`+whyP;
}
addEventListener('resize',()=>{ if(T&&!$('teamPanel').hidden&&$('cv')) drop(T,true); if(HIST&&!$('pollView').hidden) renderBump(); });
route();
