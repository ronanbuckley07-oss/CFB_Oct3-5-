<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College football live board</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F5F8;--card:#FFFFFF;--ink:#0C2340;--muted:#5A6A80;--line:#D8DEE7;--gold:#B8902A;--goldsoft:#F1E6C6;--turf:#2E6A3E;--turf2:#347548;--bad:#B23A3A;--good:#2E7D4F;--live:#D23B3B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0A1626;--card:#10213A;--ink:#E8EDF4;--muted:#93A3B8;--line:#22385A;--goldsoft:#3A3220;--turf:#24553A;--turf2:#2A5F41;--live:#F0605A;}}
:root[data-theme="dark"]{--paper:#0A1626;--card:#10213A;--ink:#E8EDF4;--muted:#93A3B8;--line:#22385A;--goldsoft:#3A3220;--turf:#24553A;--turf2:#2A5F41;--live:#F0605A;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Barlow,system-ui,-apple-system,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 40px}
h1,h2,.cond{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Masthead: the title is set like a stadium board, big and condensed */
.mast{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:18px}
.mast h1{font-size:clamp(34px,6vw,58px);line-height:.9;margin:0;font-weight:800;letter-spacing:-.5px}
.mast p{margin:8px 0 0;color:var(--muted);max-width:56ch}
.ctl{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;font:600 15px Barlow,sans-serif;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button span{opacity:.65;font-weight:500;margin-left:4px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pulse[data-s="ok"]{background:#2E9E5B}.pulse[data-s="bad"]{background:var(--bad)}
.pulse[data-s="busy"]{background:var(--gold)}
@media (max-width:640px){.ctl{align-items:flex-start}}

/* Sections */
.sec{margin-top:26px}
.sec>h2{font-size:26px;font-weight:800;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.sec>h2 small{font:500 14px Barlow,sans-serif;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
@media (max-width:400px){.grid{grid-template-columns:1fr}}

/* Game card */
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--ac,#888) 50%,var(--hc,#888) 50%)}
.card:hover{border-color:var(--gold)}
.card .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);gap:8px}
.card .when{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.card.live .when{color:var(--live)}
.card.live .when::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--live);margin-right:6px;vertical-align:1px}
.tags{display:flex;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.rz{border-color:var(--bad);color:var(--bad)}
.tag.f4{border-color:var(--gold);color:var(--gold)}
.team{display:grid;grid-template-columns:28px minmax(0,1fr) auto 14px auto;align-items:center;gap:8px}
.team img{width:28px;height:28px;object-fit:contain;display:block}
.team .nm{font:700 20px/1.1 "Barlow Condensed",sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .nm i{font:600 13px Barlow,sans-serif;font-style:normal;color:var(--muted);margin-right:4px}
.team .rec{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.team .ball{width:8px;height:8px;border-radius:50%;background:var(--gold);justify-self:center}
.team .sc{font:800 28px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.card.post .team.lost{opacity:.55}
.sit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.sit b{font:800 19px "Barlow Condensed",sans-serif}
.sit span{font-size:13px;color:var(--muted)}
.strip{width:100%;height:auto;display:block;border-radius:5px}
.wp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.wp .tr{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--paper)}
.wp .tr i{display:block;height:100%}
.wp b{font-weight:600}
.last{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:auto;padding-top:2px}
.open{font-weight:600;color:var(--ink)}
.card:hover .open{color:var(--gold)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.find{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px;padding-top:16px;border-top:1px solid var(--line);align-items:center}
.find input{font:600 15px Barlow,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:min(320px,100%)}
.find button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:600 15px Barlow,sans-serif;cursor:pointer}
.find .small{font-size:13px;color:var(--muted)}
.skel{height:230px;border-radius:12px;background:var(--card);border:1px solid var(--line);opacity:.6}
@media (prefers-reduced-motion:no-preference){.card.flash{animation:flash 1.2s ease-out}@keyframes flash{from{box-shadow:0 0 0 2px var(--gold)}to{box-shadow:0 0 0 2px transparent}}}
</style></head>
<body><div class="wrap">
<header class="mast">
  <div>
    <h1>College football, live</h1>
    <p>Scores, down and distance, and ESPN's win probability for every game on the board, refreshed every 30 seconds. Open a game to run the simulator on it.</p>
  </div>
  <div class="ctl">
    <div class="seg" role="group" aria-label="Which games">
      <button type="button" data-scope="top" aria-pressed="true">Top 25<span id="nTop"></span></button>
      <button type="button" data-scope="fbs" aria-pressed="false">All FBS<span id="nFbs"></span></button>
    </div>
    <div class="status" aria-live="polite"><i class="pulse" id="pulse"></i><span id="status">Loading the board…</span></div>
  </div>
</header>

<main id="board">
  <div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<form class="find" id="find">
  <label for="q" class="small">Not on the board?</label>
  <input id="q" type="text" placeholder="Team name or matchup, like Michigan at Ohio State" autocomplete="off">
  <button type="submit">Find game</button>
  <span class="small" id="findMsg"></span>
</form>
</div>

<script>
const API='/api/espn', EVERY=30000;
const $=id=>document.getElementById(id);
let scope='top', data=null, nextAt=0, inflight=false, prevSnap={};
try{const s=localStorage.getItem('board-scope'); if(s==='fbs'||s==='top') scope=s;}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ord=n=>['','1st','2nd','3rd','4th'][n]||'';
const dark=()=>matchMedia('(prefers-color-scheme: dark)').matches;

function setScope(s){
  scope=s; try{localStorage.setItem('board-scope',s);}catch(e){}
  document.querySelectorAll('[data-scope]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scope===s)));
  load();
}
document.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>setScope(b.dataset.scope)));

async function load(){
  if(inflight) return; inflight=true; $('pulse').dataset.s='busy';
  try{
    const r=await fetch(`${API}?kind=scoreboard&scope=${scope}`,{cache:'no-store'});
    const j=await r.json(); if(!r.ok||j.error) throw new Error(j.error||'HTTP '+r.status);
    data=j; render(); $('pulse').dataset.s='ok';
    $('nTop').textContent=j.counts?.top?` ${j.counts.top}`:''; $('nFbs').textContent=j.counts?.fbs?` ${j.counts.fbs}`:'';
  }catch(e){
    $('pulse').dataset.s='bad';
    if(!data) $('board').innerHTML=`<div class="empty">Couldn't reach ESPN (${esc(e.message)}). The board tries again in 30 seconds.</div>`;
  }finally{ inflight=false; nextAt=Date.now()+EVERY; tick(); }
}

function tick(){
  if(!$('status')) return;
  const s=Math.max(0,Math.ceil((nextAt-Date.now())/1000));
  const when=data?new Date(data.updated).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'}):null;
  $('status').textContent= document.hidden ? 'Paused while this tab is in the background' :
    inflight ? 'Refreshing…' : when ? `Updated ${when}. Next refresh in ${s}s` : `Retrying in ${s}s`;
}
setInterval(()=>{ if(!document.hidden && Date.now()>=nextAt) load(); tick(); },1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Date.now()>=nextAt-EVERY+5000) load(); tick(); });

function sortGames(gs){
  const best=g=>Math.min(g.home.rank||99,g.away.rank||99);
  const live=gs.filter(g=>g.state==='in').sort((a,b)=>best(a)-best(b)||(+new Date(a.date)-new Date(b.date)));
  const pre=gs.filter(g=>g.state==='pre').sort((a,b)=>(+new Date(a.date)-new Date(b.date))||best(a)-best(b));
  const post=gs.filter(g=>g.state==='post').sort((a,b)=>(+new Date(b.date)-new Date(a.date))||best(a)-best(b));
  return {live,pre,post};
}

function render(){
  const {live,pre,post}=sortGames(data.games||[]);
  let h='';
  if(data.fallback) h+=`<div class="empty" style="margin-bottom:12px">No ranked teams are on the board this week, so this shows every FBS game.</div>`;
  h+=section('Live now',live,live.length?`${live.length} game${live.length>1?'s':''}`:'',
    pre.length?`No games in progress. Next kickoff: ${kick(pre[0])}.`:'No games in progress.');
  if(pre.length) h+=section('Coming up',pre,`${pre.length}`);
  if(post.length) h+=section('Final',post,`${post.length}`);
  $('board').innerHTML=h;
  // Briefly outline any card whose score or down changed since the last refresh
  const snap={}; for(const g of [...live]) snap[g.id]=[g.home.score,g.away.score,g.sit?.down,g.sit?.pos].join();
  for(const id in snap) if(prevSnap[id]&&prevSnap[id]!==snap[id]){const el=document.querySelector(`[data-id="${id}"]`); if(el) el.classList.add('flash');}
  prevSnap=snap;
}
function section(title,gs,count,emptyMsg){
  return `<section class="sec"><h2>${title}${count?` <small>${count}</small>`:''}</h2>`+
    (gs.length?`<div class="grid">${gs.map(card).join('')}</div>`:`<div class="empty">${esc(emptyMsg||'Nothing here.')}</div>`)+`</section>`;
}
function kick(g){
  const d=new Date(g.date), today=new Date();
  const sameDay=d.toDateString()===today.toDateString();
  return sameDay? d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : d.toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'});
}
function logo(t){
  if(!t.logo) return `<span style="width:28px"></span>`;
  return `<picture>${t.logoDark?`<source media="(prefers-color-scheme: dark)" srcset="${esc(t.logoDark)}">`:''}<img src="${esc(t.logo)}" alt="" loading="lazy" width="28" height="28"></picture>`;
}
function teamRow(t,g,side){
  const ball=g.state==='in'&&g.sit?.poss===side;
  const lost=g.state==='post'&&g.home.score!==g.away.score&&t.score<(side==='home'?g.away:g.home).score;
  return `<div class="team${lost?' lost':''}">${logo(t)}<span class="nm">${t.rank?`<i>${t.rank}</i>`:''}${esc(t.short)}</span><span class="rec">${esc(t.record||'')}</span>${ball?'<i class="ball" title="Has the ball"></i>':'<span></span>'}<span class="sc">${g.state==='pre'||t.score==null?'':t.score}</span></div>`;
}
// Field strip, oriented like a broadcast: away team defends the left end zone, home the right
function strip(g){
  const s=g.sit; if(!s||s.pos==null||!s.poss) return '';
  const X=d=>12+d*1.76, dir=s.poss==='away'?1:-1, a=s.poss==='away'?s.pos:100-s.pos;
  const ytg=100-s.pos, togo=s.dist?Math.min(s.dist,ytg):null, fd=togo!=null?a+dir*togo:null;
  const ac=g.away.color||'#556', hc=g.home.color||'#556';
  let v=`<rect width="200" height="18" fill="var(--turf)"/><rect x="0" width="12" height="18" fill="${ac}"/><rect x="188" width="12" height="18" fill="${hc}"/>`;
  for(let d=10;d<100;d+=10) v+=`<line x1="${X(d)}" x2="${X(d)}" y1="0" y2="18" stroke="rgba(255,255,255,${d===50?.6:.25})" stroke-width=".6"/>`;
  if(fd!=null){const x1=X(Math.min(a,fd)),x2=X(Math.max(a,fd)); v+=`<rect x="${x1}" y="2" width="${Math.max(.8,x2-x1)}" height="14" fill="#F5D547" opacity=".35"/>`;
    if(togo<ytg) v+=`<line x1="${X(fd)}" x2="${X(fd)}" y1="0" y2="18" stroke="#F5D547" stroke-width="1.6"/>`;}
  v+=`<line x1="${X(a)}" x2="${X(a)}" y1="0" y2="18" stroke="#3B82F6" stroke-width="1.6"/><ellipse cx="${X(a)}" cy="9" rx="2.6" ry="1.7" fill="#7A3E1D" stroke="#fff" stroke-width=".5"/>`;
  const off=s.poss==='away'?g.away:g.home;
  return `<svg class="strip" viewBox="0 0 200 18" role="img" aria-label="${esc(off.short)} ball, ${esc(s.spot||'')}, ${togo??''} yards to the line to gain">${v}</svg>`;
}
function sitLine(g){
  const s=g.sit; if(!s) return '';
  const off=s.poss==='away'?g.away:s.poss==='home'?g.home:null;
  if(!s.down) return `<div class="sit"><b>${off?esc(off.short)+' ball':'Between plays'}</b><span>${esc(s.spot||'')}</span></div>`;
  const goal=s.pos!=null&&s.dist>=100-s.pos;
  return `<div class="sit"><b>${ord(s.down)} &amp; ${goal?'Goal':s.dist}</b><span>${off?esc(off.abbr)+' ball at ':''}${esc(s.spot||'')}</span></div>`;
}
function wpRow(g){
  let p=g.wpHome; if(p==null) return '';
  const ac=g.away.color||'#667', hc=g.home.color||'#334', lead=p>=.5?g.home:g.away, lp=Math.max(p,1-p);
  return `<div class="wp"><span>${esc(g.away.abbr)}</span><span class="tr" title="ESPN win probability"><i style="width:${((1-p)*100).toFixed(1)}%;background:${ac}"></i><i style="flex:1;background:${hc}"></i></span><span>${esc(g.home.abbr)}</span></div>
  <div class="foot" style="margin:0;padding:0"><span>ESPN win probability</span><b>${esc(lead.abbr)} ${(lp*100).toFixed(0)}%</b></div>`;
}
function card(g){
  const st=g.state, s=g.sit;
  const when= st==='in'? esc(g.detail||'Live') : st==='pre'? kick(g) : esc(g.detail||'Final');
  const tags=[]; if(s?.redZone) tags.push('<span class="tag rz">Red zone</span>'); if(s?.down===4) tags.push('<span class="tag f4">4th down</span>');
  if(g.tv) tags.push(`<span class="tag">${esc(g.tv)}</span>`);
  const line=[g.line?`Line ${esc(g.line)}`:'', g.ou?`O/U ${esc(g.ou)}`:''].filter(Boolean).join(', ');
  const cta= st==='post'?'Replay in simulator':st==='pre'?'Open simulator':'Run live sims';
  return `<a class="card ${st}" data-id="${g.id}" href="/game?event=${g.id}" style="--ac:${esc(g.away.color||'#888')};--hc:${esc(g.home.color||'#888')}">
    <div class="top"><span class="when">${when}</span><span class="tags">${tags.join('')}</span></div>
    ${teamRow(g.away,g,'away')}${teamRow(g.home,g,'home')}
    ${st==='in'?sitLine(g)+strip(g)+wpRow(g):''}
    ${st==='in'&&s?.lastPlay?`<p class="last">${esc(s.lastPlay)}</p>`:''}
    <div class="foot"><span>${line||(g.neutral?'Neutral site':'')}</span><span class="open">${cta}</span></div>
  </a>`;
}

// Finder: resolve team names to an ESPN game, then open it
$('find').addEventListener('submit',async e=>{
  e.preventDefault(); const q=$('q').value.trim(); if(!q) return;
  $('findMsg').textContent='Looking…';
  try{const r=await fetch(`${API}?kind=find&q=${encodeURIComponent(q)}`); const g=await r.json(); if(!r.ok||g.error) throw new Error(g.error||'HTTP '+r.status);
    location.href=`/game?event=${g.event}`;}
  catch(err){$('findMsg').textContent=`No match (${err.message}). Try the full school name.`;}
});

setScope(scope);
</script>
</body></html>
